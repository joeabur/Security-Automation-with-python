[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-automation-tool"
version = "0.1.0"
description = "SOC automation toolkit for IOC enrichment and incident response workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32.3",
  "shodan>=1.31.0",
  "python-dotenv>=1.0.1",
  "pandas>=2.2.2",
  "geoip2>=4.8.0",
  "jira>=3.7.0",
  "pydantic>=2.8.2",
  "rich>=13.6.0",
  "PyYAML>=6.0.1",
  "typer>=0.12.3",
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
development = [
  "pytest>=8.3.0",
  "black>=24.4.2",
  "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
